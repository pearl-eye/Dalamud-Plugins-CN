name: Sync plugin index

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/**
      - .github/workflows/sync-index.yml

permissions:
  contents: read

concurrency:
  group: sync-plugin-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test index updater
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Collect manifests and GitHub download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_index.py

      - name: Commit the index only when it changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- repo.json)" ]; then
            echo 'Plugin index already current.'
            exit 0
          fi

          # A newer registry or script must be used on the next run, never
          # overwritten by an index generated from this older checkout.
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::main changed during synchronization. Retry using the latest source.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git commit -m 'chore: sync plugin index and download counts'
          # A concurrent remote change makes this ordinary push fail safely.
          git push origin HEAD:main
